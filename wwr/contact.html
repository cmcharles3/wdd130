<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Get in touch with River Rush Expeditions. Contact our team, locate our headquarters, or send us a message about white water rafting trips and reservations.">
    <!-- Author -->
    <meta name="author" content="Charles Chiparo">
    <title>River Rush | Contact Us</title>
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <!-- Header: Logo + Navigation -->
    <header>
        <div class="logo">
            <img src="images/rapidssplash.jpg" alt="Rapids Splash Logo" width="150" height="90">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Contact Us</h1>

        <!-- Company Information + Map Section -->
        <section class="contact-info-grid">
            <div class="company-details">
                <h2>Get in Touch</h2>
                <address>
                    <p><strong>Address:</strong> 25 Birmingham Rd. Benoni 1501</p>
                    <p><strong>Phone:</strong> <a href="tel:+27764847360">(27) 76 484 7360</a></p>
                    <p><strong>Email:</strong> <a
                          href="mailto:cmcharles3@gmail.com">cmcharles3@gmail.com</a></p>
                </address>
            </div>

            <div class="map-container">
                <h2>Our Location</h2>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d183864.71714414574!2d-113.98774849646452!3d45.17600746973549!2m3!1f0!1f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53a06014e365042d%3A0xb363ad92a30d5ef!2sSalmon%2C%20ID%2083467!5e0!3m2!1sen!2sus!4v1710000000000!5m2!1sen!2sus"
                  width="600" height="450" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade" title="River Rush Location Map">
                </iframe>
            </div>
        </section>

        <!-- Employee Team Section -->
        <section class="team-section">
            <h2>Meet Our Team</h2>
            <div class="team-grid">
                <figure>
                    <img src="images/kelly.jpg" alt="Portrait of Kelly Morgan">
                    <figcaption>
                        <strong>Kelly Morgan</strong><br>
                        Lead River Guide & Safety Director
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/lynn.jpg" alt="Portrait of Lynn Jenkins">
                    <figcaption>
                        <strong>Lynn Jenkins</strong><br>
                        Trip Coordinator & Guest Services
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/team.jpg" alt="Group Portrait">
                    <figcaption>
                        <strong>David, Shania and Chen</strong><br>
                        Expedition Managers & Logistics Lead
                    </figcaption>
                </figure>
            </div>
        </section>

        <!-- Form Section -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">

                <div class="form-group">
                    <label for="user-name">Full Name</label>
                    <input type="text" id="user-name" name="user-name" required
                      placeholder="Ane Doe">
                </div>

                <div class="form-group">
                    <label for="user-email">Email Address</label>
                    <input type="email" id="user-email" name="user-email" required
                      placeholder="ane@example.com">
                </div>

                <fieldset class="form-group fieldset-purpose">
                    <legend>Purpose of Message</legend>
                    <label for="purpose-general">
                        <input type="radio" id="purpose-general" name="purpose" value="general"
                          checked>
                        General Inquiry
                    </label>
                    <label for="purpose-reservation">
                        <input type="radio" id="purpose-reservation" name="purpose"
                          value="reservation">
                        Reservation Question
                    </label>
                    <label for="purpose-sugestion">
                        <input type="radio" id="purpose-sugestion" name="purpose"
                          value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="user-message">Message</label>
                    <textarea id="user-message" name="user-message" rows="5" required
                      placeholder="How can we help you plan your rafting adventure?"></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 River Rush Expeditions | Created by Charles Chiparo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
                  alt="Facebook" width="32" height="32"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.jpg"
                  alt="Twitter" width="32" height="32"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.jpg"
                  alt="Instagram" width="32" height="32"></a>
        </nav>
    </footer>
</body>

</html>
